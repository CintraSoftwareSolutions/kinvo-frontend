# Static analysis for the Kinvo app. Run with `flutter analyze`.
#
# The base set comes from package:flutter_lints. The stricter settings below
# matter most for code that handles JSON from the API, where an implicit
# `dynamic` hides contract mismatches until they crash at runtime.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - unawaited_futures
